<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Yazdırma Stilleri -->
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                text-align: center;
            }
            #eczane-adi {
                font-size: 65pt !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Üst Kontrol Paneli (Yazdırma sırasında gizlenir) -->
    <header class="bg-emerald-700 text-white shadow-md no-print">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- ANA SAYFA BUTONU (SOL ÜST) -->
                <a href="index.html" class="bg-emerald-800 hover:bg-emerald-900 text-white p-2.5 rounded-lg shadow flex items-center justify-center transition" title="Ana Sayfaya Dön">
                    <i class="fa-solid fa-house text-xl"></i>
                </a>
                <h1 class="text-xl font-bold">Günlük Nöbetçi Eczane Çıktısı</h1>
            </div>
            <button onclick="window.print()" class="bg-white text-emerald-700 hover:bg-emerald-50 px-6 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg transition-all cursor-pointer">
                <i class="fa-solid fa-print"></i>
                <span>BUGÜNÜN NÖBETÇİSİNİ YAZDIR</span>
            </button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-1 flex flex-col items-center justify-center">
        
        <!-- Tarih Değiştirme ve İleri Geri Butonları -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 no-print flex items-center gap-3">
            <button onclick="gunDegistir(-1)" class="bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-700 px-3 py-2 rounded-xl font-bold text-sm transition-colors cursor-pointer flex items-center gap-1" title="Önceki Gün">
                <i class="fa-solid fa-chevron-left"></i> Önceki
            </button>
            
            <div class="flex items-center gap-2">
                <label class="text-xs font-semibold text-slate-500">TARİH:</label>
                <input type="date" id="secilen-tarih" onchange="gunuGuncelle()" class="px-3 py-1.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600 bg-slate-50 font-medium">
            </div>

            <button onclick="gunDegistir(1)" class="bg-slate-100 hover:bg-emerald-600 hover:text-white text-slate-700 px-3 py-2 rounded-xl font-bold text-sm transition-colors cursor-pointer flex items-center gap-1" title="Sonraki Gün">
                Sonraki <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Yazdırılacak Büyük Boy Tek Günlük Kart -->
        <div class="print-container bg-white rounded-3xl shadow-xl border-2 border-emerald-600 p-10 w-full max-w-3xl text-center">
            
            <!-- Üst Kurum Bilgisi -->
            <div class="border-b-2 border-slate-100 pb-6 mb-8">
                <span class="bg-emerald-100 text-emerald-800 font-extrabold px-5 py-2 rounded-full text-base inline-block mb-3 tracking-wider">
                    ALACA NÖBETÇİ ECZANESİ
                </span>
                <h2 id="bugun-tarih-yazi" class="text-2xl font-bold text-slate-700">5 Ekim 2026 Pazartesi</h2>
            </div>

            <!-- Nöbetçi Eczane Devasa Bilgileri -->
            <div class="py-6 space-y-8">
                <div>
                    <h1 id="eczane-adi" class="text-5xl sm:text-7xl font-black text-emerald-700 tracking-tight leading-none py-2">KAFKAS ECZANESİ</h1>
                </div>

                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 inline-block w-full">
                    <p class="text-xs uppercase tracking-widest text-slate-400 font-bold mb-1"><i class="fa-solid fa-location-dot mr-1"></i> ADRES</p>
                    <p id="eczane-adres" class="text-xl sm:text-2xl font-bold text-slate-800">GÜLHAN MAH. YOZGAT CAD. NO: 31/B</p>
                </div>

                <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 inline-block w-full">
                    <p class="text-xs uppercase tracking-widest text-emerald-600 font-bold mb-1"><i class="fa-solid fa-phone mr-1"></i> TELEFON</p>
                    <p id="eczane-tel" class="text-3xl sm:text-4xl font-extrabold text-emerald-900">0364 411 54 43</p>
                </div>
            </div>

         
        </div>

    </main>

    <!-- Alt Bilgi / Footer -->
    <footer class="text-center py-6 text-slate-400 text-xs no-print">
        <p>&copy; 2026 - Alaca Eczane Yönetim Sistemi</p>
    </footer>

    <!-- Mantık ve Otomatik Hesaplama -->
    <script>
        const eczaneler = [
            { ad: "KAFKAS ECZANESİ", adres: "GÜLHAN MAH. YOZGAT CAD. NO: 31/B", tel: "0364 411 54 43" },
            { ad: "BAYRAK ECZANESİ", adres: "GÜLHAN MAH. ZİLE CAD. NO:2 - SAAT KULESİ KARŞISI", tel: "0364 411 57 89" },
            { ad: "YAĞLILAR ECZANESİ", adres: "AYHAN MH. ÇORUM CD. NO:17", tel: "0364 411 91 91" },
            { ad: "HAYAT ECZANESİ", adres: "ALACA SAAT KULESİ YANI", tel: "0364 411 57 79" },
            { ad: "HİCRET ECZANESİ", adres: "ZİLE CAD. NO: 8", tel: "0364 411 50 88" },
            { ad: "ENGİNİN ECZANESİ", adres: "AYHAN MH. ANKARA CD. NO:14", tel: "0364 411 89 00" },
            { ad: "YILDIRIM ECZANESİ", adres: "ÇORUM CD. NO:11", tel: "0364 411 24 64" },
            { ad: "GENÇKURT ECZANESİ", adres: "ÇORUM CADDESİ AYHAN MAHALLESİ NO: 25/A", tel: "0364 411 45 33" },
            { ad: "ALACA ECZANESİ", adres: "ALACA DEVLET HASTANESİ KARŞISI", tel: "0364 411 13 33" }
        ];

        const referansTarih = new Date('2026-10-05');

        const bugunStr = new Date().toISOString().split('T')[0];
        document.getElementById('secilen-tarih').value = bugunStr;
        gunuGuncelle();

        function gunuGuncelle() {
            const secilenDeger = document.getElementById('secilen-tarih').value;
            if (!secilenDeger) return;

            const hedefTarih = new Date(secilenDeger);
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('bugun-tarih-yazi').innerText = hedefTarih.toLocaleDateString('tr-TR', options);

            const diffTime = hedefTarih - referansTarih;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            let index = diffDays % eczaneler.length;
            if (index < 0) index += eczaneler.length;

            const eczane = eczaneler[index];

            document.getElementById('eczane-adi').innerText = eczane.ad;
            document.getElementById('eczane-adres').innerText = eczane.adres;
            document.getElementById('eczane-tel').innerText = eczane.tel;
        }

        function gunDegistir(gunSayisi) {
            const inputTarih = document.getElementById('secilen-tarih');
            if (!inputTarih.value) return;

            let tarih = new Date(inputTarih.value);
            tarih.setDate(tarih.getDate() + gunSayisi);

            inputTarih.value = tarih.toISOString().split('T')[0];
            gunuGuncelle();
        }
    </script>
</body>
</html>
